name: IndexNow Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit to IndexNow
        uses: cjay/action-indexnow@v1.3
        with:
          domain: 'gaming-hub-nexus.github.io'
          key: 'a1b2c3d4e5f67890abcdef1234567890'
          keyLocation: 'https://gaming-hub-nexus.github.io/casinoplus-guides/a1b2c3d4e5f67890abcdef1234567890.txt'
