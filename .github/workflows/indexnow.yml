name: IndexNow Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit URLs to IndexNow
        run: |
          curl -X POST "https://api.indexnow.org/indexnow" \
               -H "Content-Type: application/json; charset=utf-8" \
               -d '{
                 "host": "gaming-hub-nexus.github.io",
                 "key": "a1b2c3d4e5f67890abcdef1234567890",
                 "keyLocation": "https://gaming-hub-nexus.github.io/casinoplus-guides/a1b2c3d4e5f67890abcdef1234567890.txt",
                 "urlList": [
                   "https://gaming-hub-nexus.github.io/casinoplus-guides/1.md",
                   "https://gaming-hub-nexus.github.io/casinoplus-guides/crazy-fishing-games-gameplay-modes.md",
                   "https://gaming-hub-nexus.github.io/casinoplus-guides/fishing-fun-online-game-features.md"
                 ]
               }'
